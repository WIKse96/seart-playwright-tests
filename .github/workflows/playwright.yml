name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run tests
        env:
          SEART_LOGIN_EMAIL: ${{ secrets.SEART_LOGIN_EMAIL }}
          SEART_LOGIN_PASSWORD: ${{ secrets.SEART_LOGIN_PASSWORD }}
          RUSTYKALNEUCHWYTY_LOGIN_EMAIL: ${{ secrets.RUSTYKALNEUCHWYTY_LOGIN_EMAIL }}
          RUSTYKALNEUCHWYTY_LOGIN_PASSWORD: ${{ secrets.RUSTYKALNEUCHWYTY_LOGIN_PASSWORD }}
          SEART_CZ_LOGIN_EMAIL: ${{ secrets.SEART_CZ_LOGIN_EMAIL }}
          SEART_CZ_LOGIN_PASSWORD: ${{ secrets.SEART_CZ_LOGIN_PASSWORD }}
          NOTIFY_EMAIL_ENABLED: ${{ secrets.NOTIFY_EMAIL_ENABLED }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_EMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_NTFY_ENABLED: ${{ secrets.NOTIFY_NTFY_ENABLED }}
          NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
        run: pytest --tracing=retain-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
